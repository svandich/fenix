<text x="350.0" y="348.0" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#6e7681" text-anchor="middle" font-weight="400">Los dos intercambios de calor ocurren a volumen constante, así que ambos valen nC<tspan font-size="7.6" dy="3.15">V</tspan><tspan font-size="10.5" dy="-3.15">&#8203;</tspan> ΔT y el cociente sólo deja temperaturas.</text>
<text x="350.0" y="366.0" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#6e7681" text-anchor="middle" font-weight="400">Usando TV<tspan font-size="7.6" dy="-4.41">γ−1</tspan><tspan font-size="10.5" dy="4.41">&#8203;</tspan> = cte. en las dos adiabáticas, todo se reduce a la razón de compresión r = V<tspan font-size="7.6" dy="3.15">máx</tspan><tspan font-size="10.5" dy="-3.15">&#8203;</tspan>/V<tspan font-size="7.6" dy="3.15">mín</tspan><tspan font-size="10.5" dy="-3.15">&#8203;</tspan>:</text>
<text x="350.0" y="390.0" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="600">η = 1 − 1/r<tspan font-size="9.4" dy="-5.46">γ−1</tspan><tspan font-size="13" dy="5.46">&#8203;</tspan></text>
