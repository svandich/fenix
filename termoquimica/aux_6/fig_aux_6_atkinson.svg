<text x="350.0" y="348.0" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#6e7681" text-anchor="middle" font-weight="400">Sólo hay calor en las etapas 2→3 (isocórica, +1 kJ) y 4→1 (isobárica, negativa): las adiabáticas no aportan nada al balance.</text>
<text x="350.0" y="366.0" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#6e7681" text-anchor="middle" font-weight="400">Por eso η = 1 + Q<tspan font-size="7.6" dy="3.15">4→1</tspan><tspan font-size="10.5" dy="-3.15">&#8203;</tspan>/Q<tspan font-size="7.6" dy="3.15">2→3</tspan><tspan font-size="10.5" dy="-3.15">&#8203;</tspan>, y la variación de entropía del ciclo completo es cero por ser S función de estado.</text>
